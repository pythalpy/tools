<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Downloader</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: auto; padding: 20px; }
        form div { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], select { width: 100%; padding: 8px; box-sizing: border-box; }
        input[type="submit"] { padding: 10px 20px; }
        pre { background-color: #f4f4f4; padding: 10px; border: 1px solid #ddd; white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>
    <h1>Audio Downloader</h1>
    <form method="post" action="/">
        <div>
            <label for="recitors">Select a Recitor:</label>
            <select id="recitors" name="recitors" required>
                {% for stored_name, formatted_name in recitors.items() %}
                <option value="{{ stored_name }}">{{ formatted_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="surahs">Select Surahs (Hold Ctrl/Cmd to select multiple):</label>
            <select id="surahs" name="surahs" multiple size="10" required>
                {% for number, name in surahs.items() %}
                <option value="{{ number }}">{{ number }}. {{ name }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="download_dir">Download Directory:</label>
            <input type="text" id="download_dir" name="download_dir" placeholder="e.g., /home/user/downloads" required>
        </div>
        <div>
            <input type="submit" value="Start Download">
        </div>
    </form>

    {% if report %}
        <h2>Download Report</h2>
        <pre>{{ report }}</pre>
    {% endif %}

</body>
</html>
